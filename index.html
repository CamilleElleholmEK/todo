<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do app</title>
    <script type="module" src="todo.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="custom.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section id="scope">
      <div id="listsContainer">
        <h2>To do <span>-----------------------</span></h2>
        <ul id="taskList"></ul>
        <h2>Done <span>-----------------------</span></h2>
        <ul id="doneList"></ul>
      </div>
      <button id="openPopup">+ New task</button>
      <div id="overlay"></div>
      <div id="createTaskContainer">
        <form action="">
          <div>
            <p>New task</p>
            <button id="closePopup">X</button>
          </div>
          <label for="taskText" id="taskLabel">What needs to be done?</label>
          <input type="text" id="taskText" name="taskText" required />
          <div>
            <div>
              <label for="date" id="dateLabel">Choose date</label>
              <input
                type="date"
                id="date"
                name="date"
                required
                min="2026-09-10"
                max="2026-09-24"
              />
            </div>
            <div>
              <label for="outdoorCheck">Outdoors?</label>
              <input type="checkbox" id="outdoorCheck" name="outdoorCheck" />
            </div>
          </div>
          <button type="submit" id="create">Add task</button>
        </form>
      </div>
    </section>
  </body>
</html>
